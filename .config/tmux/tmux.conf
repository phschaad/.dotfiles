# C-b is not acceptable -- Vim uses it.
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Hot reload tmux configurations with r.
bind r source-file ~/.tmux.conf

# Mouse support.
set-option -g mouse on

# Start numbering at 1.
set -g base-index 1

# Activity monitoring.
setw -g monitor-activity on
set -g visual-activity on

# Set the correct color mode.
set -g default-terminal "screen-256color"

# Remove any delay on escape. This can cause problems in vim as it suddenly
# a non-zero amount of time to exit insert mode.
set -g escape-time 0

# Set copy mode to be more vim like.
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Enable copying to system buffer.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# ------------------------
# Color theme stuff here:
# ------------------------

# Status update interval.
set -g status-interval 1

# Basic colors.
set -g status-fg colour255
set -g status-bg colour235

# Left side of the bar.
set -g status-left-style bg=colour235,bg=colour39
set -g status-left-length 40
set -g status-left "#[fg=colour235,bg=colour39,nobold] $:#S #[fg=colour39,bg=colour235,bold]"

# Right side of status bar.
set -g status-right-style bg=colour235,fg=colour39
set -g status-right-length 150
set -g status-right "#[fg=colour235,bg=colour39] W#I |  P#P | @#H "

# Window status.
set -g window-status-format "  #I:#W#F  "
set -g window-status-current-format "#[fg=colour235,bg=colour115,nobold] #I:#W#F "

# Current window status.
set -g window-status-current-style bg=colour115,fg=colour0

#set -g window-status-bg colour235

# Window with activity status.
# fg and bg are flipped here due to a bug in tmux.
set -g window-status-activity-style bg=colour39,fg=colour235

# Window separator.
set -g window-status-separator ""

# Window status alignment.
set -g status-justify centre

# Pane border.
set -g pane-border-style bg=default,fg=colour237

# Active pane border.
set -g pane-active-border-style bg=default,fg=colour39

# Pane number indicator.
set -g display-panes-colour colour235
set -g display-panes-active-colour colour39

# Clock mode.
set -g clock-mode-colour colour39
set -g clock-mode-style 24

# Message.
set -g message-style bg=colour39,fg=colour235

# Command message.
set -g message-command-style bg=colour39,fg=colour235

# Mode.
set -g mode-style bg=colour39,fg=colour235
